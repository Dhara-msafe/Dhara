<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>43 Alerts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;family=Hind:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}*{box-sizing:border-box}a{text-decoration:none}button{cursor:pointer;font-family:inherit}
@keyframes dFadeIn{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
@keyframes dNewDot{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width:390px;height:844px;background:#FBF7EE;color:#17212B;font-family:'Hind',sans-serif;display:flex;flex-direction:column;position:relative">

  <!-- nav -->
  <div style="padding:16px 20px 0;display:flex;align-items:center;gap:12px">
    <a href="Home.dc.html" aria-label="Back" style="width:48px;height:48px;border-radius:24px;background:#fff;border:1px solid #ECE4D2;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14365A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"></path></svg></a>
    <div style="flex:1;font-family:'Fraunces',serif;font-size:20px;font-weight:600;color:#14365A">Alerts</div>
    <a href="Home.dc.html" aria-label="Home" style="width:48px;height:48px;border-radius:24px;background:#fff;border:1px solid #ECE4D2;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#14365A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1z"></path></svg></a>
  </div>

  <div style="flex:1;overflow:auto;padding:14px 20px 84px">

    <!-- Tabs -->
    <div style="display:flex;gap:0;background:#fff;border:1px solid #ECE4D2;border-radius:14px;padding:4px;margin-bottom:18px;animation:dFadeIn .4s ease-out">
      <div style="flex:1;height:40px;border-radius:10px;background:linear-gradient(135deg,#14365A,#0E2740);color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center">All</div>
      <div style="flex:1;height:40px;border-radius:10px;background:transparent;color:#505B68;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:4px">Case<div style="width:6px;height:6px;border-radius:3px;background:#B42318;animation:dNewDot 2s ease-in-out infinite"></div></div>
      <div style="flex:1;height:40px;border-radius:10px;background:transparent;color:#505B68;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center">Safety</div>
    </div>

    <!-- Today -->
    <div style="font-size:11px;font-weight:700;color:#505B68;text-transform:uppercase;letter-spacing:.7px;margin-bottom:10px;animation:dFadeIn .4s ease-out .05s both">Today</div>

    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:20px">
      <sc-for list="{{today}}" as="n" hint-placeholder-count="3">
        <div style="display:flex;gap:12px;background:#fff;border:1px solid #ECE4D2;border-radius:16px;padding:14px 16px;box-shadow:0 2px 8px rgba(0,0,0,.03);animation:dFadeIn .4s ease-out {{n.d}} both">
          <div style="width:40px;height:40px;border-radius:12px;background:{{n.bg}};display:flex;align-items:center;justify-content:center;flex-shrink:0">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{n.ic}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.ipath}}"></path></svg>
          </div>
          <div style="flex:1;min-width:0">
            <div style="font-size:14px;font-weight:600;color:#14365A;margin-bottom:2px">{{n.title}}</div>
            <div style="font-size:13px;color:#505B68;line-height:1.4">{{n.body}}</div>
            <div style="font-size:11px;color:#505B68;margin-top:4px;opacity:.9">{{n.time}}</div>
          </div>
          <sc-if value="{{n.unread}}" hint-placeholder-val="{{true}}">
            <div style="width:8px;height:8px;border-radius:4px;background:#B42318;flex-shrink:0;margin-top:6px"></div>
          </sc-if>
        </div>
      </sc-for>
    </div>

    <!-- Earlier -->
    <div style="font-size:11px;font-weight:700;color:#505B68;text-transform:uppercase;letter-spacing:.7px;margin-bottom:10px;animation:dFadeIn .4s ease-out .3s both">Earlier this week</div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <sc-for list="{{earlier}}" as="e" hint-placeholder-count="3">
        <div style="display:flex;gap:12px;background:#fff;border:1px solid #ECE4D2;border-radius:16px;padding:14px 16px;box-shadow:0 2px 8px rgba(0,0,0,.03);animation:dFadeIn .4s ease-out {{e.d}} both">
          <div style="width:40px;height:40px;border-radius:12px;background:{{e.bg}};display:flex;align-items:center;justify-content:center;flex-shrink:0">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{e.ic}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{e.ipath}}"></path></svg>
          </div>
          <div style="flex:1;min-width:0">
            <div style="font-size:14px;font-weight:600;color:#14365A;margin-bottom:2px">{{e.title}}</div>
            <div style="font-size:13px;color:#505B68;line-height:1.4">{{e.body}}</div>
            <div style="font-size:11px;color:#505B68;margin-top:4px;opacity:.9">{{e.time}}</div>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <a href="Emergency.dc.html" aria-label="SOS" style="position:absolute;right:16px;bottom:28px;height:48px;padding:0 16px;border-radius:24px;background:#B42318;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;box-shadow:0 6px 18px rgba(180,35,24,.35)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a9 9 0 00-9 9c0 5 4 8 9 11 5-3 9-6 9-11a9 9 0 00-9-9z"></path></svg>SOS</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals(){
return {
today:[
 {title:"Reminder you set",body:"Example: a reminder you added yourself appears here.",time:"Example",unread:true,bg:"rgba(180,35,24,.08)",ic:"#B42318",ipath:"M12 2a10 10 0 100 20 10 10 0 000-20zM12 6v6l4 2",d:".08s"},
 {title:"Case note added",body:"Example: a note you saved on a file appears here.",time:"Example",unread:true,bg:"rgba(20,54,90,.06)",ic:"#14365A",ipath:"M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z",d:".14s"},
 {title:"Safety check-in",body:"You marked yourself safe. A message was prepared for your circle.",time:"Example",unread:false,bg:"rgba(31,107,74,.06)",ic:"#1F6B4A",ipath:"M22 11.08V12a10 10 0 11-5.93-9.14",d:".2s"}
],
earlier:[
 {title:"Rights library update",body:"Example: updates to a right you saved appear here.",time:"Example",bg:"rgba(90,75,158,.08)",ic:"#5A4B9E",ipath:"M12 3l8 4v5c0 4.5-3.2 7.3-8 9-4.8-1.7-8-4.5-8-9V7z",d:".35s"},
 {title:"Date you saved",body:"Example: a date you saved on a document appears here.",time:"Example",bg:"rgba(176,122,20,.08)",ic:"#B07A14",ipath:"M12 2a10 10 0 100 20 10 10 0 000-20zM12 16v-4M12 8h.01",d:".4s"},
 {title:"Circle update",body:"Example: shown only when the app records a contact response.",time:"Example",bg:"rgba(233,30,99,.08)",ic:"#E91E63",ipath:"M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2",d:".45s"}
]
};
}
}
</script>
</body>
</html>
