<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone number</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&amp;family=Hind:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#14365A}a:hover{color:#0E2740}
a,button{transition:transform .12s ease,background-color .15s ease;-webkit-tap-highlight-color:transparent;cursor:pointer}
a:active,button:active{transform:scale(.96)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #7A5B17;outline-offset:2px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rise{animation:rise .4s ease both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF7EE; color: #17212B; font-family: 'Hind', 'Noto Sans', sans-serif; display: flex; flex-direction: column; padding: 16px 20px 20px; gap: 16px">
  <div style="display: flex; align-items: center; gap: 8px">
    <a href="Answer.dc.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 24px; border: 1.5px solid #E7DFCC; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#14365A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <a href="Home.dc.html" aria-label="Home" style="width: 48px; height: 48px; border-radius: 24px; border: 1.5px solid #E7DFCC; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#14365A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7M6 10v9h12v-9"></path></svg>
    </a>
    <a href="Emergency.dc.html" style="margin-left: auto; height: 48px; min-width: 56px; justify-content: center; padding: 0 18px; border-radius: 24px; background: #B42318; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center">SOS</a>
  </div>
  <div aria-hidden="true" style="display: flex; gap: 6px">
    <span style="flex: 1; height: 6px; border-radius: 3px; background: #14365A"></span>
    <span style="flex: 1; height: 6px; border-radius: 3px; background: {{bar2}}"></span>
    <span style="flex: 1; height: 6px; border-radius: 3px; background: #E7DFCC"></span>
  </div>
  <sc-if value="{{stepPhone}}" hint-placeholder-val="{{true}}">
    <div style="flex: 1; display: flex; flex-direction: column; gap: 16px">
      <div>
        <h1 style="margin: 0; font-family: 'Fraunces', serif; font-size: 28px; font-weight: 600; line-height: 1.25; color: #14365A">To save your letter, add your phone number</h1>
        <p style="margin: 6px 0 0; font-size: 16px; line-height: 1.4; color: #505B68">So your files stay yours, even on a new phone. No password to remember.</p>
      </div>
      <label for="ph" style="font-size: 15px; font-weight: 600; color: #505B68">Your mobile number</label>
      <div style="display: flex; gap: 10px; margin-top: -8px">
        <div style="height: 64px; padding: 0 16px; border-radius: 16px; border: 1.5px solid #E7DFCC; background: #FFFFFF; display: flex; align-items: center; font-size: 22px; font-weight: 600">+91</div>
        <input id="ph" type="tel" inputMode="numeric" maxLength="10" value="{{phone}}" onChange="{{setPhone}}" placeholder="10 numbers" style="flex: 1; min-width: 0; height: 64px; border-radius: 16px; border: 2px solid #14365A; background: #FFFFFF; padding: 0 16px; font-family: inherit; font-size: 24px; font-weight: 600; letter-spacing: 2px; color: #17212B; box-sizing: border-box; font-variant-numeric: tabular-nums">
      </div>
      <p style="margin: 0; font-size: 15px; color: {{countFg}}; font-weight: 600">{{countMsg}}</p>
      <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
        <button onClick="{{send}}" style="height: 64px; border-radius: 18px; border: {{sendBorder}}; background: {{sendBg}}; color: {{sendFg}}; font-family: inherit; font-size: 20px; font-weight: 600">{{sendLabel}}</button>
        <a href="Answer.dc.html" style="height: 48px; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center">Not now. Go back to my answer</a>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{stepCode}}" hint-placeholder-val="{{false}}">
    <div class="rise" style="flex: 1; display: flex; flex-direction: column; gap: 16px">
      <div>
        <h1 style="margin: 0; font-family: 'Fraunces', serif; font-size: 28px; font-weight: 600; line-height: 1.25; color: #14365A">Enter the code we sent by SMS</h1>
        <p style="margin: 6px 0 0; font-size: 16px; line-height: 1.4; color: #505B68">Sent to +91 {{phone}}. <button onClick="{{change}}" style="border: none; background: none; padding: 0; font-family: inherit; font-size: 16px; font-weight: 600; color: #14365A; text-decoration: underline; min-height: 44px">Change number</button></p>
      </div>
      <label for="otp" style="font-size: 15px; font-weight: 600; color: #505B68">6-number code</label>
      <input id="otp" type="tel" inputMode="numeric" maxLength="6" value="{{code}}" onChange="{{setCode}}" placeholder="••••••" style="margin-top: -8px; height: 72px; border-radius: 16px; border: 2px solid #14365A; background: #FFFFFF; text-align: center; font-family: inherit; font-size: 32px; font-weight: 600; letter-spacing: 12px; color: #17212B; box-sizing: border-box; font-variant-numeric: tabular-nums">
      <p style="margin: 0; font-size: 15px; color: #505B68">{{resendMsg}}</p>
      <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
        <sc-if value="{{codeOk}}" hint-placeholder-val="{{false}}">
          <a href="Pin.dc.html" class="rise" style="height: 64px; border-radius: 18px; background: #1F6B4A; color: #FFFFFF; font-size: 20px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
            Code is right. Continue
          </a>
        </sc-if>
        <sc-if value="{{codeNot}}" hint-placeholder-val="{{true}}">
          <div style="height: 64px; border-radius: 18px; border: 2px dashed #505B68; box-sizing: border-box; color: #505B68; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center">Type all 6 numbers</div>
        </sc-if>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
componentDidMount() {
this.timer = setInterval(() => {
const s = this.state || {};
if (s.step === 'code' && (s.wait === undefined ? 30 : s.wait) > 0) this.setState({ wait: (s.wait === undefined ? 30 : s.wait) - 1 });
}, 1000);
}
componentWillUnmount() {
clearInterval(this.timer);
}
renderVals() {
const s = this.state || {};
const phone = s.phone || '';
const code = s.code || '';
const ok = phone.length === 10;
const onCode = s.step === 'code';
const wait = s.wait === undefined ? 30 : s.wait;
const digits = (v, n) => String(v).replace(/[^0-9]/g, '').slice(0, n);
return {
phone: phone, code: code,
stepPhone: !onCode, stepCode: onCode,
bar2: onCode ? '#14365A' : '#E7DFCC',
countMsg: ok ? 'Looks right.' : (10 - phone.length) + ' more numbers to go',
countFg: ok ? '#1F6B4A' : '#505B68',
sendLabel: ok ? 'Send me the code' : 'Type your number first',
sendBg: ok ? '#14365A' : '#FBF7EE',
sendFg: ok ? '#FFFFFF' : '#505B68',
sendBorder: ok ? '2px solid #14365A' : '2px dashed #505B68',
codeOk: code.length === 6, codeNot: code.length !== 6,
resendMsg: wait > 0 ? 'No SMS yet? You can ask again in ' + wait + ' seconds.' : 'No SMS yet? Tap Change number and try again.',
setPhone: (e) => this.setState({ phone: digits(e.target.value, 10) }),
setCode: (e) => this.setState({ code: digits(e.target.value, 6) }),
send: () => { if (ok) this.setState({ step: 'code', wait: 30 }); },
change: () => this.setState({ step: 'phone', code: '' })
};
}
}
</script>
</body>
</html>
