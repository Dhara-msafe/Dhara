<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ready notices</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&amp;family=Hind:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
a{text-decoration:none}
button{cursor:pointer;font-family:inherit}
button:active,a:active{transform:scale(.98)}
@media (prefers-reduced-motion:reduce){*{transition:none}}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FBF7EE;color:#17212B;font-family:'Hind','Noto Sans',sans-serif;display:flex;flex-direction:column">
  <div style="display:flex;align-items:center;gap:8px;padding:14px 16px 6px">
    <a href="Engine.dc.html" aria-label="Back" style="width:48px;height:48px;border-radius:24px;border:1.5px solid #E7DFCC;background:#fff;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14365A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div style="flex:1;font-size:15px;font-weight:600;color:#14365A">Ready legal notices</div>
    <a href="Home.dc.html" aria-label="Home" style="width:48px;height:48px;border-radius:24px;border:1.5px solid #E7DFCC;background:#fff;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14365A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7M6 10v9h12v-9"/></svg></a>
  </div>

  <div style="flex:1;overflow:auto;padding:6px 18px 12px">
    <h1 style="margin:2px 2px;font-family:'Fraunces',serif;font-size:25px;font-weight:600;line-height:1.2;color:#14365A">Pick a letter to start</h1>
    <p style="margin:6px 2px 12px;font-size:15px;color:#566270">DHARA fills it with your details. Send it yourself when ready.</p>

    <div style="display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#14365A,#0E2740);border-radius:14px;padding:12px 15px;margin-bottom:16px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#D3B675" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><path d="M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z"/></svg>
      <div style="flex:1;font-size:14px;color:#fff"><span style="font-weight:700;color:#D3B675">1 free notice left.</span> Unlimited with DHARA Pro.</div>
      <a href="Pro.dc.html" style="height:34px;padding:0 13px;border-radius:17px;background:#D3B675;color:#0E2740;font-size:13px;font-weight:700;display:flex;align-items:center">Pro</a>
    </div>

    <div style="display:flex;flex-direction:column;gap:11px">
      <sc-for list="{{notices}}" as="n" hint-placeholder-count="4">
        <a href="Letter.dc.html" style="display:flex;align-items:center;gap:14px;background:#fff;border:1.5px solid #ECE4D2;border-radius:17px;padding:16px;box-shadow:0 3px 12px rgba(20,54,90,.04)">
          <span style="width:48px;height:48px;border-radius:14px;background:{{n.tint}};display:flex;align-items:center;justify-content:center;flex-shrink:0;color:{{n.ink}};font-family:'Fraunces',serif;font-size:20px;font-weight:600" aria-hidden="true">{{n.g}}</span>
          <div style="flex:1"><div style="font-size:16.5px;font-weight:600;color:#17212B">{{n.name}}</div><div style="font-size:13.5px;color:#505B68">{{n.sub}}</div></div>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C9B98A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </a>
      </sc-for>
    </div>

    <a href="FirDraft.dc.html" style="margin-top:14px;display:flex;align-items:center;justify-content:center;gap:9px;height:52px;border-radius:15px;border:1.5px dashed #C9B98A;background:#fff;color:#7A5B17;font-size:15.5px;font-weight:600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7A5B17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Write a different letter</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props){super(props);this.state={};}
renderVals(){
return {notices:[
 {name:'Deposit refund',sub:'Landlord did not return deposit',g:'⌂',tint:'#EAF1EC',ink:'#1F6B4A'},
 {name:'Unpaid salary',sub:'Employer owes you wages',g:'W',tint:'#FBEFD9',ink:'#B07A14'},
 {name:'Cheque bounce',sub:'Section 138 demand notice',g:'₹',tint:'#F3E9CE',ink:'#7A5B17'},
 {name:'Complaint to SP',sub:'Police not registering FIR',g:'§',tint:'#EAF0F6',ink:'#14365A'}
]};
}
}
</script>
</body>
</html>
