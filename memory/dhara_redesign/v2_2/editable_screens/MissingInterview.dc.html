<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>42 Missing interview</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;family=Hind:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}*{box-sizing:border-box}a{text-decoration:none}button{cursor:pointer;font-family:inherit}
@keyframes dFadeIn{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width:390px;height:844px;background:#FBF7EE;color:#17212B;font-family:'Hind',sans-serif;display:flex;flex-direction:column;position:relative">

  <!-- nav -->
  <div style="padding:16px 20px 0;display:flex;align-items:center;gap:12px">
    <a href="Missing.dc.html" aria-label="Back" style="width:48px;height:48px;border-radius:24px;background:#fff;border:1px solid #ECE4D2;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14365A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"></path></svg></a>
    <div style="flex:1;font-family:'Fraunces',serif;font-size:20px;font-weight:600;color:#14365A">Person details</div>
    <a href="Home.dc.html" aria-label="Home" style="width:48px;height:48px;border-radius:24px;background:#fff;border:1px solid #ECE4D2;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#14365A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1z"></path></svg></a>
  </div>

  <div style="flex:1;overflow:auto;padding:14px 20px 84px">

    <!-- Progress -->
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;animation:dFadeIn .4s ease-out">
      <div style="display:flex;gap:4px;flex:1">
        <div style="flex:1;height:4px;border-radius:2px;background:#14365A"></div>
        <div style="flex:1;height:4px;border-radius:2px;background:#14365A"></div>
        <div style="flex:1;height:4px;border-radius:2px;background:rgba(20,54,90,.15)"></div>
        <div style="flex:1;height:4px;border-radius:2px;background:rgba(20,54,90,.15)"></div>
      </div>
      <div style="font-size:12px;font-weight:600;color:#505B68">2 of 4</div>
    </div>

    <h1 style="margin:0 0 6px;font-family:'Fraunces',serif;font-size:22px;font-weight:700;color:#14365A;animation:dFadeIn .4s ease-out .05s both">Describe the person</h1>
    <p style="margin:0 0 20px;font-size:14px;color:#505B68;line-height:1.5;animation:dFadeIn .4s ease-out .08s both">This information will be used in the police report and shared with your network.</p>

    <!-- Photo upload -->
    <div style="width:100%;height:120px;border-radius:16px;border:2px dashed #ECE4D2;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;margin-bottom:20px;animation:dFadeIn .4s ease-out .1s both">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#505B68" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><path d="M21 15l-5-5L5 21"></path></svg>
      <div style="font-size:14px;font-weight:600;color:#14365A">Upload a recent photo</div>
      <div style="font-size:12px;color:#505B68">Tap to choose from gallery</div>
    </div>

    <!-- Form fields -->
    <div style="display:flex;flex-direction:column;gap:14px">
      <sc-for list="{{fields}}" as="f" hint-placeholder-count="6">
        <div style="animation:dFadeIn .4s ease-out {{f.d}} both">
          <label style="display:block;font-size:12px;font-weight:600;color:#505B68;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">{{f.label}}</label>
          <div style="width:100%;min-height:48px;border-radius:14px;border:1px solid #ECE4D2;background:#fff;padding:12px 16px;font-size:15px;color:{{f.clr}}">{{f.val}}</div>
        </div>
      </sc-for>
    </div>

    <!-- Buttons -->
    <div style="display:flex;gap:10px;margin-top:22px;animation:dFadeIn .4s ease-out .5s both">
      <a href="Missing.dc.html" style="flex:1;height:52px;border-radius:16px;border:1px solid #ECE4D2;background:#fff;color:#14365A;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center">Back</a>
      <a href="FirDraft.dc.html" style="flex:1;height:52px;border-radius:16px;border:none;background:linear-gradient(135deg,#14365A,#0E2740);color:#fff;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 16px rgba(20,54,90,.25)">Next
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D3B675" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"></path></svg>
      </a>
    </div>
  </div>

  <a href="Emergency.dc.html" aria-label="SOS" style="position:absolute;right:16px;bottom:28px;height:48px;padding:0 16px;border-radius:24px;background:#B42318;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;box-shadow:0 6px 18px rgba(180,35,24,.35)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a9 9 0 00-9 9c0 5 4 8 9 11 5-3 9-6 9-11a9 9 0 00-9-9z"></path></svg>SOS</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals(){
return {fields:[
 {label:"Full name",val:"Add the name",clr:"#17212B",d:".15s"},
 {label:"Age",val:"Add the age",clr:"#17212B",d:".18s"},
 {label:"Height & build",val:"Add height and build",clr:"#17212B",d:".21s"},
 {label:"Last seen wearing",val:"Add clothing and items",clr:"#17212B",d:".24s"},
 {label:"Last seen location",val:"Add the place",clr:"#17212B",d:".27s"},
 {label:"Identifying marks",val:"Add any marks",clr:"#17212B",d:".3s"}
]};
}
}
</script>
</body>
</html>
