<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>39 Family journey</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;family=Hind:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}*{box-sizing:border-box}a{text-decoration:none}button{cursor:pointer;font-family:inherit}
@keyframes dFadeIn{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width:390px;height:844px;background:#FBF7EE;color:#17212B;font-family:'Hind',sans-serif;display:flex;flex-direction:column;position:relative">

  <!-- nav -->
  <div style="padding:16px 20px 0;display:flex;align-items:center;gap:12px">
    <a href="Home.dc.html" aria-label="Back" style="width:48px;height:48px;border-radius:24px;background:#fff;border:1px solid #ECE4D2;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14365A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"></path></svg></a>
    <div style="flex:1;font-family:'Fraunces',serif;font-size:20px;font-weight:600;color:#14365A">Family journey</div>
    <a href="Home.dc.html" aria-label="Home" style="width:48px;height:48px;border-radius:24px;background:#fff;border:1px solid #ECE4D2;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#14365A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1z"></path></svg></a>
  </div>

  <div style="flex:1;overflow:auto;padding:14px 20px 84px">

    <h1 style="margin:0 0 6px;font-family:'Fraunces',serif;font-size:24px;font-weight:700;color:#14365A;animation:dFadeIn .4s ease-out">Support a family member</h1>
    <p style="margin:0 0 20px;font-size:14px;color:#505B68;line-height:1.5;animation:dFadeIn .4s ease-out .05s both">Keep your own notes and dates for someone you are helping. This is separate from travel-safety journeys.</p>

    <!-- Active case card -->
    <div style="background:#fff;border:1px solid #ECE4D2;border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,.04);animation:dFadeIn .4s ease-out .1s both">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
        <div style="width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#14365A,#0E2740);display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#D3B675" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"></path><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"></path></svg></div>
        <div style="flex:1">
          <div style="font-size:15px;font-weight:600;color:#14365A">Case notes (example)</div>
          <div style="font-size:12px;color:#505B68">Entered by you</div>
        </div>
        <div style="padding:4px 10px;border-radius:8px;background:rgba(176,122,20,.1);font-size:11px;font-weight:700;color:#7A5B17">Example</div>
      </div>
      <!-- Timeline -->
      <div style="display:flex;flex-direction:column;gap:0;padding-left:18px;border-left:2px solid #ECE4D2">
        <sc-for list="{{timeline}}" as="t" hint-placeholder-count="4">
          <div style="position:relative;padding:0 0 16px 18px">
            <div style="position:absolute;left:-7px;top:2px;width:12px;height:12px;border-radius:6px;background:{{t.dot}};border:2px solid #FBF7EE"></div>
            <div style="font-size:12px;color:#505B68;margin-bottom:2px">{{t.date}}</div>
            <div style="font-size:14px;font-weight:600;color:#14365A">{{t.event}}</div>
          </div>
        </sc-for>
      </div>
    </div>

    <!-- Quick actions -->
    <div style="display:flex;gap:10px;margin-bottom:16px;animation:dFadeIn .4s ease-out .25s both">
      <a href="FamilyContacts.dc.html" style="flex:1;height:80px;background:#fff;border:1px solid #ECE4D2;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 2px 8px rgba(0,0,0,.03)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14365A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"></path></svg>
        <div style="font-size:12px;font-weight:600;color:#14365A">Contacts</div>
      </a>
      <a href="Missing.dc.html" style="flex:1;height:80px;background:#fff;border:1px solid #ECE4D2;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 2px 8px rgba(0,0,0,.03)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B42318" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="M21 21l-4.35-4.35"></path></svg>
        <div style="font-size:12px;font-weight:600;color:#14365A">Missing person</div>
      </a>
      <a href="Alerts.dc.html" style="flex:1;height:80px;background:#fff;border:1px solid #ECE4D2;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 2px 8px rgba(0,0,0,.03)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5A4B9E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"></path></svg>
        <div style="font-size:12px;font-weight:600;color:#14365A">Alerts</div>
      </a>
    </div>

    <!-- Add new case -->
    <button style="width:100%;height:52px;border-radius:16px;border:none;background:linear-gradient(135deg,#14365A,#0E2740);color:#fff;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 4px 16px rgba(20,54,90,.25);animation:dFadeIn .4s ease-out .3s both">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D3B675" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
      Add a note
    </button>
  </div>

  <a href="Emergency.dc.html" aria-label="SOS" style="position:absolute;right:16px;bottom:28px;height:48px;padding:0 16px;border-radius:24px;background:#B42318;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;box-shadow:0 6px 18px rgba(180,35,24,.35)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a9 9 0 00-9 9c0 5 4 8 9 11 5-3 9-6 9-11a9 9 0 00-9-9z"></path></svg>SOS</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals(){
return {timeline:[
 {date:"Date you add",event:"A note you add appears here",dot:"#14365A"},
 {date:"Date you add",event:"Another note or reminder",dot:"#14365A"},
 {date:"Date you add",event:"Documents you attach",dot:"#14365A"},
 {date:"Upcoming",event:"A date you set a reminder for",dot:"#B07A14"}
]};
}
}
</script>
</body>
</html>
