<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Letter saved, not sent</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&amp;family=Hind:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#14365A}a:hover{color:#0E2740}
a,button{transition:transform .12s ease,background-color .15s ease,border-color .15s ease;-webkit-tap-highlight-color:transparent;cursor:pointer}
a:active,button:active{transform:scale(.97)}
a:focus-visible,button:focus-visible{outline:3px solid #7A5B17;outline-offset:2px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rise{animation:rise .4s ease both}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .45s ease both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF7EE; color: #17212B; font-family: 'Hind', 'Noto Sans', sans-serif; display: flex; flex-direction: column; padding: 16px 20px 20px; gap: 14px">
  <div style="display: flex; align-items: center; gap: 8px">
    <a href="Answer.dc.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 24px; border: 1.5px solid #E7DFCC; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#14365A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <a href="Home.dc.html" aria-label="Home" style="width: 48px; height: 48px; border-radius: 24px; border: 1.5px solid #E7DFCC; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#14365A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7M6 10v9h12v-9"/></svg>
    </a>
    <a href="Emergency.dc.html" style="margin-left: auto; height: 48px; min-width: 56px; justify-content: center; padding: 0 18px; border-radius: 24px; background: #B42318; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center">SOS</a>
  </div>
  <div style="display: flex; align-items: center; gap: 14px">
    <div class="pop" style="width: 56px; height: 56px; border-radius: 28px; background: #1F6B4A; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    </div>
    <div>
      <h1 style="margin: 0; font-family: 'Fraunces', serif; font-size: 26px; font-weight: 600; line-height: 1.2; color: #14365A">Your letter is saved</h1>
      <p style="margin: 2px 0 0; font-size: 16px; color: #505B68">It is in My Files.</p>
    </div>
  </div>
  <div style="background: #FFFFFF; border: 2px solid #7A5B17; border-radius: 16px; padding: 12px 16px; display: flex; gap: 12px; align-items: center">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#7A5B17" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
    <p style="margin: 0; font-size: 16px; line-height: 1.4"><span style="font-weight: 600">DHARA has not sent this to anyone.</span> Only you can send it.</p>
  </div>
  <a href="Letter.dc.html" style="height: 64px; border-radius: 18px; background: #14365A; color: #FFFFFF; font-size: 19px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M5 4h10l4 4v12H5z"/><path d="M9 12h6M9 16h6"/></svg>
    Open and check the letter
  </a>
  <div>
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px">
      <h2 style="margin: 0; font-size: 16px; font-weight: 600; color: #505B68">What you do next</h2>
      <span style="font-size: 15px; font-weight: 600; color: {{countFg}}">{{count}}</span>
    </div>
    <div aria-hidden="true" style="height: 8px; border-radius: 4px; background: #E7DFCC; overflow: hidden; margin-bottom: 10px">
      <div style="height: 8px; width: {{pct}}; background: #1F6B4A; border-radius: 4px; transition: width .3s ease"></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{steps}}" as="st" hint-placeholder-count="3">
        <button onClick="{{st.toggle}}" aria-pressed="{{st.done}}" style="display: flex; gap: 14px; align-items: center; background: {{st.bg}}; border: 2px solid {{st.bd}}; border-radius: 16px; padding: 12px 14px; min-height: 68px; font-family: inherit; text-align: left">
          <span style="width: 40px; height: 40px; border-radius: 20px; background: {{st.dot}}; color: #FFFFFF; font-size: 18px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{st.mark}}</span>
          <span style="flex: 1; font-size: 16px; line-height: 1.4; color: #17212B; text-decoration: {{st.strike}}">{{st.text}}</span>
        </button>
      </sc-for>
    </div>
  </div>
  <sc-if value="{{allDone}}" hint-placeholder-val="{{false}}">
    <p class="rise" style="margin: 0; font-size: 16px; font-weight: 600; color: #1F6B4A; text-align: center">All steps done. Well done. If nothing happens in [number] days, ask DHARA what to do next.</p>
  </sc-if>
  <div style="margin-top: auto; display: flex; gap: 10px">
    <a href="Files.dc.html" style="flex: 1; height: 56px; border-radius: 16px; background: #FFFFFF; border: 1.5px solid #E7DFCC; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">My Files</a>
    <a href="Home.dc.html" style="flex: 1; height: 56px; border-radius: 16px; background: #FFFFFF; border: 1.5px solid #E7DFCC; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">Ask something else</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const done = s.done || {};
const texts = [
'Check the letter. Fix your name, address and the amount.',
'Give it to your landlord yourself.',
'Keep a photo of it in My Files as proof.'
];
const n = texts.filter((t, i) => done[i]).length;
return {
steps: texts.map((t, i) => {
const d = !!done[i];
return {
text: t, done: d,
mark: d ? '✓' : String(i + 1),
bg: d ? '#EEF6F1' : '#FFFFFF',
bd: d ? '#1F6B4A' : '#E7DFCC',
dot: d ? '#1F6B4A' : '#14365A',
strike: d ? 'line-through' : 'none',
toggle: () => { const nx = Object.assign({}, done); nx[i] = !d; this.setState({ done: nx }); }
};
}),
count: n + ' of 3 done',
countFg: n === 3 ? '#1F6B4A' : '#505B68',
pct: Math.round(n / 3 * 100) + '%',
allDone: n === 3
};
}
}
</script>
</body>
</html>
