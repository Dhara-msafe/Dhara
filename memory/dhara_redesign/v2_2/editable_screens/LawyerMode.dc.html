<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>50 Advocate profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;family=Hind:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}*{box-sizing:border-box}a{text-decoration:none}button{cursor:pointer;font-family:inherit}
@keyframes dFadeIn{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width:390px;height:844px;background:#FBF7EE;color:#17212B;font-family:'Hind',sans-serif;display:flex;flex-direction:column;position:relative">

  <!-- nav -->
  <div style="padding:16px 20px 0;display:flex;align-items:center;gap:12px">
    <a href="AdvocateRegister.dc.html" aria-label="Back" style="width:48px;height:48px;border-radius:24px;background:#fff;border:1px solid #ECE4D2;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14365A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"></path></svg></a>
    <div style="flex:1;font-family:'Fraunces',serif;font-size:20px;font-weight:600;color:#14365A">Advocate profile</div>
    <a href="Home.dc.html" aria-label="Home" style="width:48px;height:48px;border-radius:24px;background:#fff;border:1px solid #ECE4D2;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#14365A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1z"></path></svg></a>
  </div>

  <div style="flex:1;overflow:auto;padding:14px 20px 84px">

    <!-- Profile header -->
    <div style="text-align:center;margin-bottom:20px;animation:dFadeIn .4s ease-out">
      <div style="width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,#5A4B9E,#3D2D7A);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:26px;font-weight:700;color:#fff;margin:0 auto 12px;box-shadow:0 8px 24px rgba(90,75,158,.25)">+</div>
      <div style="font-family:'Fraunces',serif;font-size:22px;font-weight:700;color:#14365A">Advocate name</div>
      <div style="font-size:13px;color:#505B68;margin-top:2px">Family law &amp; DV specialist</div>
      
      <div style="display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:8px;background:rgba(20,54,90,.06);color:#14365A;font-size:12px;font-weight:600;margin-top:8px">Profile details are entered by the advocate</div>
    </div>

    <!-- Stats -->
    <div style="display:flex;gap:8px;margin-bottom:18px;animation:dFadeIn .4s ease-out .08s both">
      <sc-for list="{{stats}}" as="s" hint-placeholder-count="3">
        <div style="flex:1;background:#fff;border:1px solid #ECE4D2;border-radius:14px;padding:12px;text-align:center">
          <div style="font-family:'Fraunces',serif;font-size:20px;font-weight:700;color:#14365A">{{s.val}}</div>
          <div style="font-size:11px;color:#505B68;margin-top:2px">{{s.label}}</div>
        </div>
      </sc-for>
    </div>

    <!-- About -->
    <div style="margin-bottom:18px;animation:dFadeIn .4s ease-out .12s both">
      <div style="font-size:12px;font-weight:700;color:#505B68;text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px">About</div>
      <div style="font-size:14px;color:#17212B;line-height:1.6;background:#fff;border:1px solid #ECE4D2;border-radius:14px;padding:14px 16px">The advocate writes their own profile here: practice areas, languages and how to reach them. DHARA does not check or endorse it.</div>
    </div>

    <!-- Specialisations -->
    <div style="margin-bottom:18px;animation:dFadeIn .4s ease-out .16s both">
      <div style="font-size:12px;font-weight:700;color:#505B68;text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px">Specialisations</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <sc-for list="{{specs}}" as="sp" hint-placeholder-count="5">
          <div style="height:30px;padding:0 12px;border-radius:10px;background:rgba(20,54,90,.05);border:1px solid rgba(20,54,90,.08);font-size:12px;font-weight:600;color:#14365A;display:flex;align-items:center">{{sp}}</div>
        </sc-for>
      </div>
    </div>

    <!-- Action buttons -->
    <div style="display:flex;gap:10px;animation:dFadeIn .4s ease-out .2s both">
      <button style="flex:1;height:48px;border-radius:14px;border:1px solid #ECE4D2;background:#fff;font-size:14px;font-weight:600;color:#14365A;display:flex;align-items:center;justify-content:center;gap:8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#14365A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6A19.79 19.79 0 012.12 4.18 2 2 0 014.11 2h3a2 2 0 012 1.72"></path></svg>Call</button>
      <button style="flex:1;height:48px;border-radius:14px;border:none;background:linear-gradient(135deg,#14365A,#0E2740);font-size:14px;font-weight:600;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 16px rgba(20,54,90,.25)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D3B675" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"></path></svg>Book consult</button>
    </div>
  </div>

  <a href="Emergency.dc.html" aria-label="SOS" style="position:absolute;right:16px;bottom:28px;height:48px;padding:0 16px;border-radius:24px;background:#B42318;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;box-shadow:0 6px 18px rgba(180,35,24,.35)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a9 9 0 00-9 9c0 5 4 8 9 11 5-3 9-6 9-11a9 9 0 00-9-9z"></path></svg>SOS</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals(){
return {
stats:[
 
 
 {val:"Set by advocate",label:"Fees"}
],
specs:["Family law","Domestic violence","Maintenance","Divorce","POCSO","Protection orders","Custody"]
};
}
}
</script>
</body>
</html>
