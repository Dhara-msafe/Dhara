<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Choose language · DHARA design reference</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dhara.css"></head>
<body class="">
<a class="skip" href="#main">Skip to main content</a>
<div class="shell"><div><header class="topbar"><a class="iconbtn" href="#" aria-label="Back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 5l-7 7 7 7"/></svg></a><div class="title">Choose language</div><a class="iconbtn" href="03-home-ask.html" aria-label="Home"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1z"/></svg></a></header><main id="main"><div class="stack"><p class="eyebrow">Step 1 of 4</p><h1>Choose your language</h1><p class="muted">DHARA speaks in the language you prefer. Which features work in each language is shown after you choose.</p>
<label class="stack" style="gap:.375rem"><span class="eyebrow">Search languages</span><input type="search" id="q" placeholder="Search languages" autocomplete="off"></label>
<div class="langs stack" id="list" role="group" aria-label="Languages"><button class="lang" aria-pressed="true" lang="en"><span><span class="nat">English</span><span class="eng">English</span></span><span class="sel">Selected</span></button><button class="lang" aria-pressed="false" lang="hi"><span><span class="nat">हिन्दी</span><span class="eng">Hindi</span></span><span class="sel">Selected</span></button><button class="lang" aria-pressed="false" lang="bn"><span><span class="nat">বাংলা</span><span class="eng">Bengali</span></span><span class="sel">Selected</span></button><button class="lang" aria-pressed="false" lang="ta"><span><span class="nat">தமிழ்</span><span class="eng">Tamil</span></span><span class="sel">Selected</span></button><button class="lang" aria-pressed="false" lang="te"><span><span class="nat">తెలుగు</span><span class="eng">Telugu</span></span><span class="sel">Selected</span></button><button class="lang" aria-pressed="false" lang="mr"><span><span class="nat">मराठी</span><span class="eng">Marathi</span></span><span class="sel">Selected</span></button><button class="lang" aria-pressed="false" lang="gu"><span><span class="nat">ગુજરાતી</span><span class="eng">Gujarati</span></span><span class="sel">Selected</span></button><button class="lang" aria-pressed="false" lang="kn"><span><span class="nat">ಕನ್ನಡ</span><span class="eng">Kannada</span></span><span class="sel">Selected</span></button><button class="lang" aria-pressed="false" lang="ml"><span><span class="nat">മലയാളം</span><span class="eng">Malayalam</span></span><span class="sel">Selected</span></button><button class="lang" aria-pressed="false" lang="pa"><span><span class="nat">ਪੰਜਾਬੀ</span><span class="eng">Punjabi</span></span><span class="sel">Selected</span></button></div>
<p class="muted" id="count" role="status">Showing the list set up in the app. The live selector was observed with 23 options.</p>
<div class="sticky-cta"><a class="btn primary lg" style="width:100%" href="02-consent.html">Continue</a></div></div></main></div></div>
<script>
document.querySelectorAll('.lang').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.lang').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true')}));
document.getElementById('q').addEventListener('input',e=>{const v=e.target.value.toLowerCase();document.querySelectorAll('.lang').forEach(b=>{b.hidden=!b.textContent.toLowerCase().includes(v)})});</script>
</body></html>
