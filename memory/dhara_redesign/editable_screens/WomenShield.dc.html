<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>33 Women's Shield</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;family=Hind:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}*{box-sizing:border-box}a{text-decoration:none}button{cursor:pointer;font-family:inherit}
@keyframes dFadeIn{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
@keyframes dPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width:390px;height:844px;background:linear-gradient(180deg,#2D1B4E 0%,#1A0E30 100%);color:#fff;font-family:'Hind',sans-serif;display:flex;flex-direction:column;position:relative;overflow:hidden">

  <!-- Decorative circles -->
  <div style="position:absolute;top:-60px;right:-40px;width:200px;height:200px;border-radius:50%;background:rgba(233,30,99,.08)"></div>
  <div style="position:absolute;bottom:120px;left:-60px;width:160px;height:160px;border-radius:50%;background:rgba(173,20,87,.06)"></div>

  <!-- nav -->
  <div style="padding:16px 20px 0;display:flex;align-items:center;gap:12px;position:relative;z-index:1">
    <a href="Home.dc.html" aria-label="Back" style="width:48px;height:48px;border-radius:24px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"></path></svg></a>
    <div style="flex:1;font-family:'Fraunces',serif;font-size:20px;font-weight:600">Women's Shield</div>
    <a href="Home.dc.html" aria-label="Home" style="width:48px;height:48px;border-radius:24px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1z"></path></svg></a>
  </div>

  <div style="flex:1;overflow:auto;padding:14px 20px 20px;position:relative;z-index:1">

    <!-- Shield icon -->
    <div style="width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,#E91E63,#AD1457);display:flex;align-items:center;justify-content:center;margin-bottom:16px;animation:dFadeIn .4s ease-out;box-shadow:0 8px 32px rgba(233,30,99,.35)">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4v5c0 4.5-3.2 7.3-8 9-4.8-1.7-8-4.5-8-9V7z"></path><path d="M9 12l2 2 4-4"></path></svg>
    </div>

    <h1 style="margin:0 0 6px;font-family:'Fraunces',serif;font-size:26px;font-weight:700;line-height:1.2;animation:dFadeIn .4s ease-out .05s both">Your safety toolkit</h1>
    <p style="margin:0 0 22px;font-size:14px;color:rgba(255,255,255,.78);line-height:1.5;animation:dFadeIn .4s ease-out .1s both">Tools designed for women. Use them anytime you feel unsafe. Everything stays private on your phone.</p>

    <!-- Quick SOS -->
    <a href="Emergency.dc.html" style="display:flex;align-items:center;gap:14px;border-radius:18px;background:linear-gradient(135deg,#B42318,#7F1D1D);padding:16px 18px;margin-bottom:16px;box-shadow:0 8px 24px rgba(180,35,24,.3);animation:dPulse 3s ease-in-out infinite,dFadeIn .4s ease-out .12s both">
      <div style="width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6A19.79 19.79 0 012.12 4.11 2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.362 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0122 16.92z"></path></svg></div>
      <div style="flex:1">
        <div style="font-size:16px;font-weight:700">Quick SOS call</div>
        <div style="font-size:12px;color:rgba(255,255,255,.78);margin-top:2px">Opens your dialer and prepares a message. You press call and send.</div>
      </div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
    </a>

    <!-- Tools grid -->
    <div style="font-size:11px;font-weight:700;color:rgba(255,255,255,.78);text-transform:uppercase;letter-spacing:.7px;margin-bottom:10px">Safety tools</div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <sc-for list="{{tools}}" as="t" hint-placeholder-count="5">
        <a href="{{t.href}}" style="background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:16px;display:flex;align-items:center;gap:14px;animation:dFadeIn .4s ease-out {{t.d}} both">
          <div style="width:48px;height:48px;border-radius:14px;background:{{t.bg}};display:flex;align-items:center;justify-content:center;flex-shrink:0">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.ic}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{t.path}}"></path></svg>
          </div>
          <div style="flex:1;min-width:0">
            <div style="font-size:16px;font-weight:600;color:#FFFFFF">{{t.name}}</div>
            <div style="font-size:12px;color:rgba(255,255,255,.78);margin-top:2px">{{t.sub}}</div>
          </div>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
        </a>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals(){
return {tools:[
 {name:"Silent alert",sub:"Prepare a location message to your circle",href:"SilentAlert.dc.html",path:"M15 17h5l-1.4-1.4A6.5 6.5 0 0017 11V8a5 5 0 00-10 0v3a6.5 6.5 0 00-1.6 4.6L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9",bg:"rgba(233,30,99,.15)",ic:"#E91E63",d:".18s"},
 {name:"Safety phrases",sub:"Secret code words for your circle",href:"SafetyPhrases.dc.html",path:"M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z",bg:"rgba(90,75,158,.15)",ic:"#B39DDB",d:".22s"},
 {name:"Panic lesson",sub:"What to do when you feel threatened",href:"PanicLesson.dc.html",path:"M12 2a10 10 0 100 20 10 10 0 000-20zM12 8v4M12 16h.01",bg:"rgba(176,122,20,.15)",ic:"#D3B675",d:".26s"},
 {name:"Safety plan",sub:"Personal escape & evidence checklist",href:"SafetyPlan.dc.html",path:"M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4",bg:"rgba(31,107,74,.15)",ic:"#4CAF50",d:".3s"},
 {name:"Guardian share",sub:"Share live location with trusted people",href:"GuardianShare.dc.html",path:"M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8zM23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75",bg:"rgba(233,30,99,.15)",ic:"#F48FB1",d:".34s"}
]};
}
}
</script>
</body>
</html>
