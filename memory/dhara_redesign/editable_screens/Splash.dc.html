<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&amp;family=Hind:wght@300;400;500;600;700&amp;family=Noto+Sans+Devanagari:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
a{text-decoration:none}
@keyframes dFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes dSpin{to{transform:rotate(360deg)}}
@keyframes dSpinR{to{transform:rotate(-360deg)}}
@keyframes dPulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes dRise{0%{transform:translateY(20px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes dGlow{0%,100%{box-shadow:0 0 40px rgba(211,182,117,.4)}50%{box-shadow:0 0 70px rgba(211,182,117,.7)}}
@keyframes dOrb1{0%{transform:translate(0,0)}50%{transform:translate(30px,-40px)}100%{transform:translate(0,0)}}
@keyframes dOrb2{0%{transform:translate(0,0)}50%{transform:translate(-25px,35px)}100%{transform:translate(0,0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#070E18;color:#FBF7EE;font-family:'Hind',sans-serif;display:flex;flex-direction:column;align-items:center">

  <!-- ambient orbs -->
  <div aria-hidden="true" style="position:absolute;top:80px;left:-60px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(20,54,90,.6),transparent 70%);filter:blur(60px);animation:dOrb1 12s ease-in-out infinite"></div>
  <div aria-hidden="true" style="position:absolute;top:300px;right:-80px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(211,182,117,.2),transparent 70%);filter:blur(50px);animation:dOrb2 15s ease-in-out infinite"></div>
  <div aria-hidden="true" style="position:absolute;bottom:100px;left:40px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(31,107,74,.15),transparent 70%);filter:blur(40px)"></div>

  <!-- star field -->
  <svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position:absolute;inset:0;opacity:.3">
    <circle cx="45" cy="120" r="1" fill="#D3B675"></circle><circle cx="340" cy="80" r="1.2" fill="#D3B675"></circle>
    <circle cx="120" cy="200" r="0.8" fill="#D3B675"></circle><circle cx="310" cy="250" r="1" fill="#D3B675"></circle>
    <circle cx="60" cy="400" r="0.7" fill="#D3B675"></circle><circle cx="350" cy="450" r="1.1" fill="#D3B675"></circle>
    <circle cx="180" cy="150" r="0.6" fill="#D3B675"></circle><circle cx="260" cy="180" r="0.9" fill="#D3B675"></circle>
  </svg>

  <!-- chakra mark -->
  <div style="position:relative;margin-top:180px;width:220px;height:220px;display:flex;align-items:center;justify-content:center;animation:dFloat 6s ease-in-out infinite">
    <svg width="220" height="220" viewBox="0 0 220 220" aria-hidden="true" style="position:absolute;animation:dSpin 50s linear infinite">
      <circle cx="110" cy="110" r="100" fill="none" stroke="url(#gRing)" stroke-width="0.8"></circle>
      <circle cx="110" cy="110" r="84" fill="none" stroke="#D3B675" stroke-width="1" opacity=".5"></circle>
      <g stroke="#D3B675" stroke-width="0.8" opacity=".4">
        <line x1="110" y1="18" x2="110" y2="202"></line><line x1="18" y1="110" x2="202" y2="110"></line>
        <line x1="45" y1="45" x2="175" y2="175"></line><line x1="175" y1="45" x2="45" y2="175"></line>
        <line x1="75" y1="23" x2="145" y2="197"></line><line x1="197" y1="75" x2="23" y2="145"></line>
        <line x1="145" y1="23" x2="75" y2="197"></line><line x1="197" y1="145" x2="23" y2="75"></line>
      </g>
      <defs><linearGradient id="gRing" x1="0" y1="0" x2="220" y2="220"><stop offset="0%" stop-color="#D3B675"></stop><stop offset="100%" stop-color="#8B6914"></stop></linearGradient></defs>
    </svg>
    <svg width="140" height="140" viewBox="0 0 140 140" aria-hidden="true" style="position:absolute;animation:dSpinR 35s linear infinite">
      <circle cx="70" cy="70" r="60" fill="none" stroke="#D3B675" stroke-width="0.6" stroke-dasharray="2 8" opacity=".6"></circle>
    </svg>
    <div style="position:relative;width:100px;height:100px;border-radius:50px;background:linear-gradient(145deg,#E8CC85,#B8903C);display:flex;align-items:center;justify-content:center;animation:dGlow 4s ease-in-out infinite">
      <span style="font-family:'Fraunces',serif;font-size:48px;font-weight:600;color:#0E2740;line-height:1;margin-top:3px">ध</span>
    </div>
  </div>

  <!-- wordmark -->
  <div style="margin-top:36px;text-align:center;animation:dRise .8s ease-out .3s both">
    <div style="font-family:'Fraunces',serif;font-size:48px;font-weight:600;letter-spacing:10px;color:#FBF7EE;padding-left:10px">DHARA</div>
    <div style="margin-top:6px;font-size:13px;font-weight:500;letter-spacing:4px;color:#D3B675;text-transform:uppercase">Know your rights</div>
  </div>

  <p style="margin:20px 42px 0;text-align:center;font-size:16px;line-height:1.6;color:rgba(251,247,238,.6);font-weight:300;animation:dRise .8s ease-out .5s both">
    Speak in your language.<br>Understand the law. Stay safe.
  </p>

  <!-- CTA -->
  <div style="position:absolute;left:24px;right:24px;bottom:44px;display:flex;flex-direction:column;gap:16px;animation:dRise .8s ease-out .7s both">
    <a href="Main.dc.html" style="height:60px;border-radius:16px;background:linear-gradient(135deg,#D3B675,#C4A45A);color:#0E2740;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 40px rgba(211,182,117,.35)">
      Get started
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E2740" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </a>
    <div style="display:flex;align-items:center;justify-content:center;gap:8px;color:rgba(251,247,238,.45);font-size:12px;font-weight:400">
      <span aria-hidden="true" style="width:6px;height:6px;border-radius:3px;background:#1F6B4A;animation:dPulse 2.4s ease-in-out infinite"></span>
      Guest access available · Some features work offline
    </div>
  </div>
</div>
</x-dc>
