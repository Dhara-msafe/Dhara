<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>49 Find advocate</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;family=Hind:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}*{box-sizing:border-box}a{text-decoration:none}button{cursor:pointer;font-family:inherit}
@keyframes dFadeIn{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width:390px;height:844px;background:#FBF7EE;color:#17212B;font-family:'Hind',sans-serif;display:flex;flex-direction:column;position:relative">

  <!-- nav -->
  <div style="padding:16px 20px 0;display:flex;align-items:center;gap:12px">
    <a href="Home.dc.html" aria-label="Back" style="width:48px;height:48px;border-radius:24px;background:#fff;border:1px solid #ECE4D2;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14365A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"></path></svg></a>
    <div style="flex:1;font-family:'Fraunces',serif;font-size:20px;font-weight:600;color:#14365A">Find an advocate</div>
    <a href="Home.dc.html" aria-label="Home" style="width:48px;height:48px;border-radius:24px;background:#fff;border:1px solid #ECE4D2;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#14365A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1z"></path></svg></a>
  </div>

  <div style="flex:1;overflow:auto;padding:14px 20px 84px">

    <!-- Search -->
    <div style="display:flex;gap:8px;margin-bottom:18px;animation:dFadeIn .4s ease-out">
      <div style="flex:1;height:48px;border-radius:14px;border:1px solid #ECE4D2;background:#fff;padding:0 16px;display:flex;align-items:center;gap:10px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#505B68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="M21 21l-4.35-4.35"></path></svg>
        <span style="font-size:14px;color:#505B68;opacity:.5">Search by name or area</span>
      </div>
      <div style="width:48px;height:48px;border-radius:14px;border:1px solid #ECE4D2;background:#fff;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#14365A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3H2l8 9.46V19l4 2v-8.54z"></path></svg></div>
    </div>

    <!-- Filter chips -->
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;animation:dFadeIn .4s ease-out .05s both">
      <div style="height:34px;padding:0 14px;border-radius:10px;background:linear-gradient(135deg,#14365A,#0E2740);color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center">All</div>
      <div style="height:34px;padding:0 14px;border-radius:10px;border:1px solid #ECE4D2;background:#fff;color:#505B68;font-size:12px;font-weight:600;display:flex;align-items:center">Family law</div>
      <div style="height:34px;padding:0 14px;border-radius:10px;border:1px solid #ECE4D2;background:#fff;color:#505B68;font-size:12px;font-weight:600;display:flex;align-items:center">Criminal</div>
      <div style="height:34px;padding:0 14px;border-radius:10px;border:1px solid #ECE4D2;background:#fff;color:#505B68;font-size:12px;font-weight:600;display:flex;align-items:center">DV</div>
      <div style="height:34px;padding:0 14px;border-radius:10px;border:1px solid #ECE4D2;background:#fff;color:#505B68;font-size:12px;font-weight:600;display:flex;align-items:center">Pro bono</div>
    </div>

    <!-- Advocate cards -->
    <div style="display:flex;flex-direction:column;gap:10px">
      <sc-for list="{{advocates}}" as="a" hint-placeholder-count="3">
        <a href="LawyerMode.dc.html" style="display:block;background:#fff;border:1px solid #ECE4D2;border-radius:18px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.03);animation:dFadeIn .4s ease-out {{a.d}} both">
          <div style="display:flex;gap:14px;margin-bottom:12px">
            <div style="width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,{{a.c1}},{{a.c2}});display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:18px;font-weight:700;color:#fff;flex-shrink:0">{{a.init}}</div>
            <div style="flex:1;min-width:0">
              <div style="font-size:15px;font-weight:600;color:#14365A">{{a.name}}</div>
              <div style="font-size:12px;color:#505B68">{{a.spec}}</div>
              
            </div>
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <sc-for list="{{a.tags}}" as="t" hint-placeholder-count="3">
              <div style="height:26px;padding:0 10px;border-radius:8px;background:rgba(20,54,90,.04);font-size:11px;font-weight:600;color:#505B68;display:flex;align-items:center">{{t}}</div>
            </sc-for>
          </div>
          <div style="display:flex;gap:8px;margin-top:12px">
            <div style="flex:1;height:40px;border-radius:12px;border:1px solid #ECE4D2;background:#fff;font-size:13px;font-weight:600;color:#14365A;display:flex;align-items:center;justify-content:center;gap:6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#14365A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6A19.79 19.79 0 012.12 4.18 2 2 0 014.11 2h3a2 2 0 012 1.72"></path></svg>Call</div>
            <div style="flex:1;height:40px;border-radius:12px;background:linear-gradient(135deg,#14365A,#0E2740);font-size:13px;font-weight:600;color:#fff;display:flex;align-items:center;justify-content:center;gap:6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#D3B675" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"></path></svg>Consult</div>
          </div>
        </a>
      </sc-for>
    </div>
  </div>

  <a href="Emergency.dc.html" aria-label="SOS" style="position:absolute;right:16px;bottom:28px;height:48px;padding:0 16px;border-radius:24px;background:#B42318;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;box-shadow:0 6px 18px rgba(180,35,24,.35)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a9 9 0 00-9 9c0 5 4 8 9 11 5-3 9-6 9-11a9 9 0 00-9-9z"></path></svg>SOS</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals(){
return {advocates:[
 {name:"Advocate name",spec:"Family law & DV specialist",init:"RS",c1:"#5A4B9E",c2:"#3D2D7A",tags:["Family law","Domestic violence","Pro bono"],d:".1s"},
 {name:"Advocate name",spec:"Criminal & women's rights",init:"VS",c1:"#14365A",c2:"#0E2740",tags:["Criminal","Women's rights","POCSO"],d:".18s"},
 {name:"Advocate name",spec:"Property & maintenance",init:"PN",c1:"#1F6B4A",c2:"#145A3E",tags:["Property","Maintenance","Divorce"],d:".26s"}
]};
}
}
</script>
</body>
</html>
