<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Help</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&amp;family=Hind:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#14365A}a:hover{color:#0E2740}
a,button{transition:transform .12s ease,background-color .15s ease;-webkit-tap-highlight-color:transparent;cursor:pointer}
a:active,button:active{transform:scale(.97)}
a:focus-visible,button:focus-visible{outline:3px solid #7A5B17;outline-offset:2px}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.rise{animation:rise .35s ease both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF7EE; color: #17212B; font-family: 'Hind', 'Noto Sans', sans-serif; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 8px; padding: 16px 20px 0">
    <a href="Home.dc.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 24px; border: 1.5px solid #E7DFCC; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#14365A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <h1 style="margin: 0 0 0 6px; font-family: 'Fraunces', serif; font-size: 26px; font-weight: 600; color: #14365A">Help</h1>
    <a href="Emergency.dc.html" style="margin-left: auto; height: 48px; min-width: 56px; justify-content: center; padding: 0 18px; border-radius: 24px; background: #B42318; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center">SOS</a>
  </div>
  <div style="flex: 1; overflow: auto; padding: 14px 20px; display: flex; flex-direction: column; gap: 12px">
    <h2 style="margin: 0; font-size: 15px; font-weight: 600; color: #505B68">Stay safe</h2>
    <a href="HeadOut.dc.html" class="rise" style="min-height: 84px; border-radius: 18px; background: #14365A; text-decoration: none; display: flex; align-items: center; gap: 14px; padding: 12px 16px">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#D3B675" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 21s-6-5.5-6-10a6 6 0 0112 0c0 4.5-6 10-6 10z"/><circle cx="12" cy="11" r="2"/></svg>
      <span style="flex: 1; line-height: 1.3"><span style="display: block; font-size: 19px; font-weight: 600; color: #FFFFFF">Going out? Share your journey</span><span style="display: block; font-size: 15px; color: #FFFFFF">Let people you trust see you get there</span></span>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </a>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
      <a href="Circle.dc.html" style="height: 92px; border-radius: 16px; border: 1.5px solid #E7DFCC; background: #FFFFFF; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 0 6px">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#14365A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="9" r="3"/><circle cx="17" cy="10.5" r="2.5"/><path d="M3 20c0-3 2.5-5 5-5s5 2 5 5M15 20c0-2.5 1-4 2-4s4 1.5 4 4"/></svg>
        <span style="font-size: 14px; font-weight: 600; color: #17212B; text-align: center; line-height: 1.15">Trusted people</span>
      </a>
      <a href="Record.dc.html" style="height: 92px; border-radius: 16px; border: 1.5px solid #E7DFCC; background: #FFFFFF; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 0 6px">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#14365A" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3" fill="#B42318" stroke="none"/></svg>
        <span style="font-size: 14px; font-weight: 600; color: #17212B; text-align: center; line-height: 1.15">Record proof</span>
      </a>
      <a href="Officer.dc.html" style="height: 92px; border-radius: 16px; border: 1.5px solid #E7DFCC; background: #FFFFFF; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 0 6px">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#14365A" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 11h6M7 14h4"/></svg>
        <span style="font-size: 14px; font-weight: 600; color: #17212B; text-align: center; line-height: 1.15">Card for an officer</span>
      </a>
    </div>
    <h2 style="margin: 6px 0 0; font-size: 15px; font-weight: 600; color: #505B68">Common problems. Tap one to ask.</h2>
    <div style="background: #FFFFFF; border: 1.5px solid #E7DFCC; border-radius: 16px; overflow: hidden">
      <sc-for list="{{problems}}" as="p" hint-placeholder-count="4">
        <a href="Heard.dc.html" style="min-height: 60px; display: flex; align-items: center; gap: 14px; padding: 0 16px; text-decoration: none; border-bottom: {{p.line}}">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#14365A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{p.d}}"/></svg>
          <span style="flex: 1; font-size: 17px; font-weight: 500; color: #17212B">{{p.label}}</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#505B68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </a>
      </sc-for>
    </div>
    <button onClick="{{toggleTour}}" style="min-height: 60px; border-radius: 16px; border: 1.5px solid #14365A; background: {{tourBg}}; color: {{tourFg}}; font-family: inherit; display: flex; align-items: center; gap: 14px; padding: 0 16px; text-align: left">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10v4h3l5 4V6L7 10z"/><path d="M16 9a4 4 0 010 6"/></svg>
      <span style="flex: 1; font-size: 17px; font-weight: 600">{{tourLabel}}</span>
    </button>
  </div>
  <nav style="height: 72px; display: flex; background: #FFFFFF; border-top: 1.5px solid #E7DFCC; flex-shrink: 0">
    <a href="Home.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #505B68">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7M6 10v9h12v-9"/></svg>
      <span style="font-size: 14px; font-weight: 600">Home</span>
    </a>
    <a href="Files.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #505B68">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h6l2 2h10v10H3z"/></svg>
      <span style="font-size: 14px; font-weight: 600">My Files</span>
    </a>
    <a href="Help.dc.html" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #14365A; border-top: 3px solid #14365A; margin-top: -1.5px">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 115 0c0 2-2.5 2-2.5 4M12 17v.5"/></svg>
      <span style="font-size: 14px; font-weight: 600">Help</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const tour = !!s.tour;
const raw = [
['Police will not take my complaint', 'M12 3l7 3v5c0 5-3.2 8.3-7 10-3.8-1.7-7-5-7-10V6z'],
['Money taken by online fraud', 'M7 5h10M7 9h10M7 5h3a4 4 0 010 8H7l7 6'],
['My pay has not been given', 'M3 7h18v12H3zM9 7V5h6v2'],
['Landlord wants me out', 'M4 11l8-7 8 7M6 10v9h12v-9']
];
return {
problems: raw.map((r, i) => ({ label: r[0], d: r[1], line: i < raw.length - 1 ? '1.5px solid #E7DFCC' : 'none' })),
tourLabel: tour ? 'Playing. Tap to stop' : 'Hear how DHARA works, in one minute',
tourBg: tour ? '#14365A' : '#FFFFFF',
tourFg: tour ? '#FFFFFF' : '#14365A',
toggleTour: () => this.setState({ tour: !tour })
};
}
}
</script>
</body>
</html>
