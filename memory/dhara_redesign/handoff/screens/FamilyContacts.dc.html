<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>40 Family contacts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;family=Hind:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}*{box-sizing:border-box}a{text-decoration:none}button{cursor:pointer;font-family:inherit}
@keyframes dFadeIn{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width:390px;height:844px;background:#FBF7EE;color:#17212B;font-family:'Hind',sans-serif;display:flex;flex-direction:column;position:relative">

  <!-- nav -->
  <div style="padding:16px 20px 0;display:flex;align-items:center;gap:12px">
    <a href="FamilyJourney.dc.html" aria-label="Back" style="width:48px;height:48px;border-radius:24px;background:#fff;border:1px solid #ECE4D2;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14365A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"></path></svg></a>
    <div style="flex:1;font-family:'Fraunces',serif;font-size:20px;font-weight:600;color:#14365A">Family contacts</div>
    <a href="Home.dc.html" aria-label="Home" style="width:48px;height:48px;border-radius:24px;background:#fff;border:1px solid #ECE4D2;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#14365A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1z"></path></svg></a>
  </div>

  <div style="flex:1;overflow:auto;padding:14px 20px 84px">

    <h1 style="margin:0 0 6px;font-family:'Fraunces',serif;font-size:24px;font-weight:700;color:#14365A;animation:dFadeIn .4s ease-out">Emergency contacts</h1>
    <p style="margin:0 0 20px;font-size:14px;color:#505B68;line-height:1.5;animation:dFadeIn .4s ease-out .05s both">People you choose to contact if a family member needs help. You add and remove them.</p>

    <!-- Contact cards -->
    <div style="display:flex;flex-direction:column;gap:10px">
      <sc-for list="{{contacts}}" as="c" hint-placeholder-count="4">
        <div style="display:flex;align-items:center;gap:14px;background:#fff;border:1px solid #ECE4D2;border-radius:16px;padding:14px 16px;box-shadow:0 2px 8px rgba(0,0,0,.03);animation:dFadeIn .4s ease-out {{c.d}} both">
          <div style="width:46px;height:46px;border-radius:14px;background:{{c.bg}};display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:17px;font-weight:700;color:#fff">{{c.init}}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:15px;font-weight:600;color:#14365A">{{c.name}}</div>
            <div style="font-size:12px;color:#505B68">{{c.role}}</div>
            <div style="font-size:12px;color:#505B68;margin-top:2px">{{c.phone}}</div>
          </div>
          <div style="display:flex;gap:8px">
            <button aria-label="Open phone dialler for this contact" style="width:48px;height:48px;border-radius:12px;background:rgba(31,107,74,.08);border:none;display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1F6B4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6A19.79 19.79 0 012.12 4.18 2 2 0 014.11 2h3a2 2 0 012 1.72c.12.96.35 1.9.68 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.91.33 1.85.56 2.81.68a2 2 0 011.72 2.03z"></path></svg></button>
            <button aria-label="Prepare a message for this contact" style="width:48px;height:48px;border-radius:12px;background:rgba(20,54,90,.06);border:none;display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#14365A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"></path></svg></button>
          </div>
        </div>
      </sc-for>
    </div>

    <!-- Add contact -->
    <button style="margin-top:14px;width:100%;height:52px;border-radius:16px;border:2px dashed #ECE4D2;background:transparent;color:#505B68;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;animation:dFadeIn .4s ease-out .4s both">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#505B68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
      Add emergency contact
    </button>

    <!-- Helpline card -->
    <div style="margin-top:16px;background:linear-gradient(135deg,#14365A,#0E2740);border-radius:16px;padding:16px;animation:dFadeIn .4s ease-out .45s both">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D3B675" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6A19.79 19.79 0 012.12 4.18 2 2 0 014.11 2h3a2 2 0 012 1.72c.12.96.35 1.9.68 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.91.33 1.85.56 2.81.68a2 2 0 011.72 2.03z"></path></svg>
        <div style="font-size:14px;font-weight:600;color:#fff">24/7 Helplines</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <sc-for list="{{helplines}}" as="h" hint-placeholder-count="3">
          <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:rgba(255,255,255,.08);border-radius:10px">
            <div style="font-size:13px;color:rgba(255,255,255,.7)">{{h.name}}</div>
            <div style="font-size:14px;font-weight:700;color:#D3B675">{{h.num}}</div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>

  <a href="Emergency.dc.html" aria-label="SOS" style="position:absolute;right:16px;bottom:28px;height:48px;padding:0 16px;border-radius:24px;background:#B42318;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;box-shadow:0 6px 18px rgba(180,35,24,.35)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a9 9 0 00-9 9c0 5 4 8 9 11 5-3 9-6 9-11a9 9 0 00-9-9z"></path></svg>SOS</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals(){
return {
contacts:[
 {name:"Contact name",role:"Add a role",phone:"Phone number",init:"+",bg:"linear-gradient(135deg,#14365A,#0E2740)",d:".1s"},
 {name:"Contact name",role:"Add a role",phone:"Phone number",init:"+",bg:"linear-gradient(135deg,#5A4B9E,#3D2E7E)",d:".15s"},
 {name:"Contact name",role:"Add a role",phone:"Phone number",init:"+",bg:"linear-gradient(135deg,#1F6B4A,#145A3A)",d:".2s"},
 {name:"Contact name",role:"Add a role",phone:"Phone number",init:"+",bg:"linear-gradient(135deg,#B07A14,#8A5D10)",d:".25s"}
],
helplines:[
 {name:"Women helpline",num:"181"},
 {name:"Police",num:"100"},
 {name:"National Commission for Women",num:"7827-170-170"}
]
};
}
}
</script>
</body>
</html>
