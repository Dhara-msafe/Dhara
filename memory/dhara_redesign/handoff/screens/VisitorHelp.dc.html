<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>53 Visitor help</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;family=Hind:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}*{box-sizing:border-box}a{text-decoration:none}button{cursor:pointer;font-family:inherit}
@keyframes dFadeIn{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width:390px;height:844px;background:#FBF7EE;color:#17212B;font-family:'Hind',sans-serif;display:flex;flex-direction:column;position:relative">

  <!-- nav -->
  <div style="padding:16px 20px 0;display:flex;align-items:center;gap:12px">
    <a href="Home.dc.html" aria-label="Back" style="width:48px;height:48px;border-radius:24px;background:#fff;border:1px solid #ECE4D2;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14365A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"></path></svg></a>
    <div style="flex:1;font-family:'Fraunces',serif;font-size:20px;font-weight:600;color:#14365A">Visitor help</div>
    <a href="Home.dc.html" aria-label="Home" style="width:48px;height:48px;border-radius:24px;background:#fff;border:1px solid #ECE4D2;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#14365A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1z"></path></svg></a>
  </div>

  <div style="flex:1;overflow:auto;padding:14px 20px 84px">

    <!-- Hero -->
    <div style="background:linear-gradient(135deg,#14365A,#0E2740);border-radius:22px;padding:22px 20px;margin-bottom:18px;animation:dFadeIn .4s ease-out">
      <div style="width:48px;height:48px;border-radius:14px;background:rgba(211,182,117,.15);display:flex;align-items:center;justify-content:center;margin-bottom:12px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#D3B675" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3M12 17h.01"></path></svg>
      </div>
      <div style="font-family:'Fraunces',serif;font-size:20px;font-weight:700;color:#fff;margin-bottom:4px">Need help at a police station or court?</div>
      <div style="font-size:13px;color:rgba(255,255,255,.78);line-height:1.5">DHARA helps visitors understand their rights and navigate the process step by step.</div>
    </div>

    <!-- Quick actions -->
    <div style="font-size:11px;font-weight:700;color:#505B68;text-transform:uppercase;letter-spacing:.7px;margin-bottom:10px;animation:dFadeIn .4s ease-out .06s both">I am visiting a</div>

    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:20px">
      <sc-for list="{{places}}" as="p" hint-placeholder-count="3">
        <a href="{{p.href}}" style="display:flex;align-items:center;gap:14px;background:#fff;border:1px solid #ECE4D2;border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.03);animation:dFadeIn .4s ease-out {{p.d}} both">
          <div style="width:44px;height:44px;border-radius:14px;background:{{p.bg}};display:flex;align-items:center;justify-content:center;flex-shrink:0">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{p.ic}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{p.ipath}}"></path></svg>
          </div>
          <div style="flex:1;min-width:0">
            <div style="font-size:15px;font-weight:600;color:#14365A">{{p.name}}</div>
            <div style="font-size:12px;color:#505B68;line-height:1.4;margin-top:2px">{{p.desc}}</div>
          </div>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#505B68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
        </a>
      </sc-for>
    </div>

    <!-- Common questions -->
    <div style="font-size:11px;font-weight:700;color:#505B68;text-transform:uppercase;letter-spacing:.7px;margin-bottom:10px;animation:dFadeIn .4s ease-out .3s both">Common questions</div>

    <div style="display:flex;flex-direction:column;gap:6px;animation:dFadeIn .4s ease-out .35s both">
      <sc-for list="{{faqs}}" as="f" hint-placeholder-count="4">
        <a href="Listening.dc.html" style="display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #ECE4D2;border-radius:12px;padding:12px 14px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#D3B675" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3M12 17h.01"></path></svg>
          <div style="flex:1;font-size:13px;color:#17212B;min-width:0">{{f}}</div>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#505B68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
        </a>
      </sc-for>
    </div>
  </div>

  <a href="Emergency.dc.html" aria-label="SOS" style="position:absolute;right:16px;bottom:28px;height:48px;padding:0 16px;border-radius:24px;background:#B42318;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;box-shadow:0 6px 18px rgba(180,35,24,.35)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a9 9 0 00-9 9c0 5 4 8 9 11 5-3 9-6 9-11a9 9 0 00-9-9z"></path></svg>SOS</a>
</div>
</x-dc>

 {name:"Court",desc:"Understand court proceedings and your rights",href:"Rights.dc.html",bg:"rgba(90,75,158,.06)",ic:"#5A4B9E",ipath:"M3 21h18M5 21V7l7-4 7 4v14",d:".16s"},
 {name:"Legal aid centre",desc:"Get free legal help and advice",href:"AdvocateRegister.dc.html",bg:"rgba(31,107,74,.06)",ic:"#1F6B4A",ipath:"M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75",d:".22s"}

</body>
</html>
