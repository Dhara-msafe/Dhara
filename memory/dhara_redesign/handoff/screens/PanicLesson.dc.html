<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>36 Panic lesson</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;family=Hind:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}*{box-sizing:border-box}a{text-decoration:none}button{cursor:pointer;font-family:inherit}
@keyframes dFadeIn{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width:390px;height:844px;background:linear-gradient(180deg,#2D1B4E 0%,#1A0E30 100%);color:#fff;font-family:'Hind',sans-serif;display:flex;flex-direction:column;position:relative">

  <!-- nav -->
  <div style="padding:16px 20px 0;display:flex;align-items:center;gap:12px">
    <a href="WomenShield.dc.html" aria-label="Back" style="width:48px;height:48px;border-radius:24px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"></path></svg></a>
    <div style="flex:1;font-family:'Fraunces',serif;font-size:20px;font-weight:600">Panic lesson</div>
    <a href="Home.dc.html" aria-label="Home" style="width:48px;height:48px;border-radius:24px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1z"></path></svg></a>
  </div>

  <div style="flex:1;overflow:auto;padding:14px 20px 84px">

    <h1 style="margin:0 0 6px;font-family:'Fraunces',serif;font-size:24px;font-weight:700;animation:dFadeIn .4s ease-out">What to do when threatened</h1>
    <p style="margin:0 0 20px;font-size:14px;color:rgba(255,255,255,.78);line-height:1.5;animation:dFadeIn .4s ease-out .05s both">Learn these steps now so they become instinct. Practice when you feel safe.</p>

    <!-- Progress -->
    <div style="display:flex;gap:4px;margin-bottom:20px;animation:dFadeIn .4s ease-out .08s both">
      <div style="flex:1;height:4px;border-radius:2px;background:#E91E63"></div>
      <div style="flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.15)"></div>
      <div style="flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.15)"></div>
    </div>

    <!-- Steps -->
    <div style="display:flex;flex-direction:column;gap:12px">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="5">
        <div style="background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:16px;animation:dFadeIn .4s ease-out {{s.d}} both">
          <div style="display:flex;align-items:flex-start;gap:12px">
            <div style="width:36px;height:36px;border-radius:50%;background:{{s.bg}};display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'Fraunces',serif;font-size:16px;font-weight:700;color:{{s.nc}}">{{s.n}}</div>
            <div style="flex:1">
              <div style="font-size:16px;font-weight:600;margin-bottom:4px">{{s.title}}</div>
              <div style="font-size:13px;color:rgba(255,255,255,.78);line-height:1.5">{{s.desc}}</div>
            </div>
          </div>
        </div>
      </sc-for>
    </div>

    <!-- Practice button -->
    <button style="margin-top:18px;width:100%;height:56px;border-radius:16px;border:none;background:linear-gradient(135deg,#5A4B9E,#3D2E7E);color:#fff;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 24px rgba(90,75,158,.3);animation:dFadeIn .4s ease-out .5s both">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
      Practice this drill
    </button>

    <!-- Tip -->
    <div style="margin-top:14px;display:flex;gap:10px;background:rgba(176,122,20,.1);border:1px solid rgba(176,122,20,.2);border-radius:14px;padding:14px 16px;animation:dFadeIn .4s ease-out .55s both">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D3B675" stroke-width="1.8" stroke-linecap="round" style="flex-shrink:0;margin-top:2px"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zM12 16v-4M12 8h.01"></path></svg>
      <div style="font-size:13px;color:rgba(255,255,255,.78);line-height:1.5">Practice this drill weekly. Muscle memory could save your life.</div>
    </div>
  </div>

  <a href="Emergency.dc.html" aria-label="SOS" style="position:absolute;right:16px;bottom:28px;height:48px;padding:0 16px;border-radius:24px;background:#B42318;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;box-shadow:0 6px 18px rgba(180,35,24,.35)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a9 9 0 00-9 9c0 5 4 8 9 11 5-3 9-6 9-11a9 9 0 00-9-9z"></path></svg>SOS</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals(){
return {steps:[
 {n:"1",title:"Stay calm, breathe",desc:"Take 3 deep breaths. A clear head helps you act faster than panic.",bg:"rgba(233,30,99,.15)",nc:"#E91E63",d:".1s"},
 {n:"2",title:"Assess the threat",desc:"Is the person armed? How many exits are nearby? Can you reach your phone?",bg:"rgba(90,75,158,.15)",nc:"#B39DDB",d:".15s"},
 {n:"3",title:"Create distance",desc:"Move towards the nearest exit. Put furniture or objects between you and the threat.",bg:"rgba(176,122,20,.15)",nc:"#D3B675",d:".2s"},
 {n:"4",title:"Alert someone",desc:"Use your silent alert, safety phrase, or dial 112. Even a missed call signals help.",bg:"rgba(233,30,99,.15)",nc:"#F48FB1",d:".25s"},
 {n:"5",title:"Get to safety",desc:"Go to a police station, hospital, or any crowded public place. Do not go home alone.",bg:"rgba(31,107,74,.15)",nc:"#4CAF50",d:".3s"}
]};
}
}
</script>
</body>
</html>
