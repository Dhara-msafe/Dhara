<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>34 Silent alert</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;family=Hind:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}*{box-sizing:border-box}a{text-decoration:none}button{cursor:pointer;font-family:inherit}
@keyframes dFadeIn{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
@keyframes dRipple{0%{box-shadow:0 0 0 0 rgba(233,30,99,.4)}70%{box-shadow:0 0 0 20px rgba(233,30,99,0)}100%{box-shadow:0 0 0 0 rgba(233,30,99,0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width:390px;height:844px;background:linear-gradient(180deg,#2D1B4E 0%,#1A0E30 100%);color:#fff;font-family:'Hind',sans-serif;display:flex;flex-direction:column;position:relative">

  <!-- nav -->
  <div style="padding:16px 20px 0;display:flex;align-items:center;gap:12px">
    <a href="WomenShield.dc.html" aria-label="Back" style="width:48px;height:48px;border-radius:24px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"></path></svg></a>
    <div style="flex:1;font-family:'Fraunces',serif;font-size:20px;font-weight:600">Silent alert</div>
    <a href="Home.dc.html" aria-label="Home" style="width:48px;height:48px;border-radius:24px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1z"></path></svg></a>
  </div>

  <div style="flex:1;overflow:auto;padding:14px 20px 20px;display:flex;flex-direction:column;align-items:center">

    <p style="text-align:center;font-size:14px;color:rgba(255,255,255,.78);margin:0 0 8px;animation:dFadeIn .4s ease-out">Quiet by design. You stay in control of what is sent.</p>
    <h1 style="margin:0 0 32px;font-family:'Fraunces',serif;font-size:24px;font-weight:700;text-align:center;animation:dFadeIn .4s ease-out .05s both">Press &amp; hold to prepare a silent alert</h1>

    <!-- Big alert button -->
    <div style="width:180px;height:180px;border-radius:50%;background:linear-gradient(135deg,#E91E63,#AD1457);display:flex;align-items:center;justify-content:center;box-shadow:0 12px 48px rgba(233,30,99,.4);animation:dRipple 2s ease-out infinite,dFadeIn .5s ease-out .1s both;margin-bottom:28px">
      <div style="width:140px;height:140px;border-radius:50%;background:linear-gradient(135deg,#F06292,#E91E63);display:flex;align-items:center;justify-content:center;border:3px solid rgba(255,255,255,.2)">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4v5c0 4.5-3.2 7.3-8 9-4.8-1.7-8-4.5-8-9V7z"></path></svg>
      </div>
    </div>

    <div style="font-size:13px;color:rgba(255,255,255,.78);text-align:center;margin-bottom:28px;animation:dFadeIn .4s ease-out .15s both">Hold for 3 seconds. You will be asked to confirm.</div>

    <!-- What happens -->
    <div style="width:100%;font-size:11px;font-weight:700;color:rgba(255,255,255,.78);text-transform:uppercase;letter-spacing:.7px;margin-bottom:12px;animation:dFadeIn .4s ease-out .2s both">When you confirm</div>

    <div style="width:100%;display:flex;flex-direction:column;gap:10px">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
        <div style="background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;animation:dFadeIn .4s ease-out {{s.d}} both">
          <div style="width:36px;height:36px;border-radius:10px;background:{{s.bg}};display:flex;align-items:center;justify-content:center;flex-shrink:0">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{s.ic}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{s.path}}"></path></svg>
          </div>
          <div style="flex:1">
            <div style="font-size:14px;font-weight:600">{{s.name}}</div>
            <div style="font-size:12px;color:rgba(255,255,255,.78);margin-top:1px">{{s.sub}}</div>
          </div>
        </div>
      </sc-for>
    </div>

    <!-- Setup link -->
    <a href="Circle.dc.html" style="margin-top:20px;display:flex;align-items:center;justify-content:center;gap:8px;height:48px;width:100%;border-radius:14px;border:1px dashed rgba(255,255,255,.2);color:rgba(255,255,255,.78);font-size:14px;font-weight:600;animation:dFadeIn .4s ease-out .4s both">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"></path></svg>
      Edit your trusted circle
    </a>
  </div>

  <a href="Emergency.dc.html" aria-label="SOS" style="position:absolute;right:16px;bottom:28px;height:48px;padding:0 16px;border-radius:24px;background:#B42318;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;box-shadow:0 6px 18px rgba(180,35,24,.35)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a9 9 0 00-9 9c0 5 4 8 9 11 5-3 9-6 9-11a9 9 0 00-9-9z"></path></svg>SOS</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals(){
return {steps:[
 {name:"Location message",sub:"Prepares your location for your circle. You press send.",path:"M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z",bg:"rgba(233,30,99,.15)",ic:"#E91E63",d:".25s"},
 {name:"Audio recording",sub:"Starts a short recording saved to this phone",path:"M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3zM19 10v2a7 7 0 01-14 0v-2",bg:"rgba(90,75,158,.15)",ic:"#B39DDB",d:".3s"},
 {name:"Call emergency services",sub:"Opens your phone dialer. You place the call.",path:"M12 3l8 4v5c0 4.5-3.2 7.3-8 9-4.8-1.7-8-4.5-8-9V7z",bg:"rgba(176,122,20,.15)",ic:"#D3B675",d:".35s"}
]};
}
}
</script>
</body>
</html>
