<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>48 DHARA Pro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;family=Hind:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}*{box-sizing:border-box}a{text-decoration:none}button{cursor:pointer;font-family:inherit}
@keyframes dFadeIn{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
@keyframes dShimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width:390px;height:844px;background:linear-gradient(180deg,#0E2740 0%,#14365A 40%,#FBF7EE 100%);color:#17212B;font-family:'Hind',sans-serif;display:flex;flex-direction:column;position:relative">

  <!-- nav -->
  <div style="padding:16px 20px 0;display:flex;align-items:center;gap:12px">
    <a href="Me.dc.html" aria-label="Back" style="width:48px;height:48px;border-radius:24px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"></path></svg></a>
    <div style="flex:1"></div>
    <a href="Home.dc.html" aria-label="Home" style="width:48px;height:48px;border-radius:24px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1z"></path></svg></a>
  </div>

  <div style="flex:1;overflow:auto;padding:14px 20px 84px">

    <!-- Hero -->
    <div style="text-align:center;margin-bottom:28px;animation:dFadeIn .4s ease-out">
      <div style="width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,#D3B675,#B07A14);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 8px 32px rgba(211,182,117,.4)"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg></div>
      <div style="font-family:'Fraunces',serif;font-size:28px;font-weight:700;color:#fff;margin-bottom:4px">DHARA Pro</div>
      <div style="font-size:14px;color:rgba(255,255,255,.78);line-height:1.5">Complete legal protection for you and your family</div>
    </div>

    <!-- Features -->
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:24px">
      <sc-for list="{{features}}" as="f" hint-placeholder-count="5">
        <div style="display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.95);border:1px solid #ECE4D2;border-radius:16px;padding:14px 16px;box-shadow:0 2px 8px rgba(0,0,0,.04);animation:dFadeIn .4s ease-out {{f.d}} both">
          <div style="width:38px;height:38px;border-radius:12px;background:{{f.bg}};display:flex;align-items:center;justify-content:center;flex-shrink:0">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{f.ic}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{f.ipath}}"></path></svg>
          </div>
          <div style="flex:1;min-width:0">
            <div style="font-size:14px;font-weight:600;color:#14365A">{{f.label}}</div>
            <div style="font-size:12px;color:#505B68;line-height:1.4">{{f.desc}}</div>
          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D3B675" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>
        </div>
      </sc-for>
    </div>

    <!-- Pricing -->
    <div style="background:#fff;border:2px solid #D3B675;border-radius:20px;padding:20px;text-align:center;margin-bottom:16px;animation:dFadeIn .4s ease-out .4s both">
      <div style="font-size:12px;font-weight:700;color:#B07A14;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px">Pro plan</div>
      <div style="display:flex;align-items:baseline;justify-content:center;gap:4px;margin-bottom:4px">
        <span style="font-family:'Fraunces',serif;font-size:26px;font-weight:700;color:#14365A">Price to be confirmed</span>
        <span style="font-size:14px;color:#505B68"></span><span style="display:none">/span>
      </div>
      <div style="font-size:12px;color:#505B68;margin-bottom:12px">No price is shown until it is confirmed. Any price shown later comes from the approved application configuration.</div>
      <button style="width:100%;height:52px;border-radius:14px;border:none;background:linear-gradient(135deg,#D3B675,#B07A14);color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 16px rgba(211,182,117,.4);background-size:200% 100%;animation:dShimmer 3s ease-in-out infinite">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
        Upgrade to Pro
      </button>
    </div>

    <div style="text-align:center;font-size:12px;color:#505B68;animation:dFadeIn .4s ease-out .45s both">Trial and cancellation terms are shown only when confirmed.</div>
  </div>

  <a href="Emergency.dc.html" aria-label="SOS" style="position:absolute;right:16px;bottom:28px;height:48px;padding:0 16px;border-radius:24px;background:#B42318;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;box-shadow:0 6px 18px rgba(180,35,24,.35)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a9 9 0 00-9 9c0 5 4 8 9 11 5-3 9-6 9-11a9 9 0 00-9-9z"></path></svg>SOS</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals(){
return {features:[
 {label:"Unlimited legal drafts",desc:"Generate FIRs, complaints, notices and letters without limits",bg:"rgba(20,54,90,.06)",ic:"#14365A",ipath:"M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z",d:".12s"},
 {label:"Priority responses",desc:"Faster responses when the service is busy",bg:"rgba(90,75,158,.08)",ic:"#5A4B9E",ipath:"M13 2L3 14h9l-1 8 10-12h-9l1-8",d:".16s"},
 {label:"Family protection",desc:"Add up to 5 family members with their own safety profiles",bg:"rgba(233,30,99,.06)",ic:"#E91E63",ipath:"M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M23 21v-2a4 4 0 00-3-3.87",d:".2s"},
 {label:"Advocate connect",desc:"Browse advocates by district. Profiles are entered by the advocates.",bg:"rgba(31,107,74,.06)",ic:"#1F6B4A",ipath:"M22 11.08V12a10 10 0 11-5.93-9.14M22 4L12 14.01l-3-3",d:".24s"},
 {label:"Case tracking",desc:"Keep your own notes and dates for a case",bg:"rgba(176,122,20,.06)",ic:"#B07A14",ipath:"M12 2a10 10 0 100 20 10 10 0 000-20zM12 6v6l4 2",d:".28s"}
]};
}
}
</script>
</body>
</html>
