<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>On the way</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&amp;family=Hind:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#14365A}a:hover{color:#0E2740}
a,button{transition:transform .12s ease,background-color .15s ease;-webkit-tap-highlight-color:transparent;cursor:pointer}
a:active,button:active{transform:scale(.96)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #7A5B17;outline-offset:2px}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.rise{animation:rise .35s ease both}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.blink{animation:blink 1.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF7EE; color: #17212B; font-family: 'Hind', 'Noto Sans', sans-serif; display: flex; flex-direction: column">
  <div style="background: {{headBg}}; padding: 12px 16px; display: flex; align-items: center; gap: 8px; transition: background-color .3s ease">
    <a href="HeadOut.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; border: 1.5px solid #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <a href="Home.dc.html" aria-label="Home" style="width: 44px; height: 44px; border-radius: 22px; border: 1.5px solid #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7M6 10v9h12v-9"/></svg>
    </a>
    <div style="flex: 1; padding-left: 4px">
      <div style="font-size: 18px; font-weight: 600; color: #FFFFFF; display: flex; align-items: center; gap: 8px"><span class="{{dotClass}}" style="width: 12px; height: 12px; border-radius: 6px; background: #FFFFFF"></span>{{headTitle}}</div>
      <div style="font-size: 14px; color: #FFFFFF">{{headSub}}</div>
    </div>
  </div>
  <sc-if value="{{live}}" hint-placeholder-val="{{true}}">
    <div style="padding: 14px 20px 20px; flex: 1; display: flex; flex-direction: column; gap: 12px">
      <div style="background: #FFFFFF; border: 1.5px solid #E7DFCC; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
        <div aria-hidden="true" style="position: relative; height: 28px">
          <div style="position: absolute; left: 0; right: 0; top: 11px; height: 6px; border-radius: 3px; background: #E7DFCC"></div>
          <div style="position: absolute; left: 0; top: 11px; height: 6px; border-radius: 3px; background: #1F6B4A; width: {{pct}}; transition: width 1s linear"></div>
          <div style="position: absolute; top: 1px; left: {{pct}}; width: 26px; height: 26px; margin-left: -13px; border-radius: 13px; background: #FFFFFF; border: 5px solid #1F6B4A; box-sizing: border-box; transition: left 1s linear"></div>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 15px; font-weight: 600; color: #505B68"><span>Started</span><span>Home</span></div>
        <div style="display: flex; align-items: baseline; gap: 8px; border-top: 1.5px solid #E7DFCC; padding-top: 10px">
          <span style="font-family: 'Fraunces', serif; font-size: 34px; font-weight: 600; color: #14365A; font-variant-numeric: tabular-nums">{{clock}}</span>
          <span style="font-size: 15px; color: #505B68">left</span>
          <button onClick="{{more}}" style="margin-left: auto; height: 48px; padding: 0 16px; border-radius: 24px; border: 1.5px solid #14365A; background: #FBF7EE; font-family: inherit; font-size: 15px; font-weight: 600; color: #14365A">+ 30 min</button>
        </div>
      </div>
      <a href="CheckIn.dc.html" style="background: #FFFFFF; border: 1.5px solid #D3B675; border-radius: 16px; padding: 12px 16px; display: flex; gap: 12px; align-items: center; text-decoration: none">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#7A5B17" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span style="flex: 1; font-size: 15px; line-height: 1.4; color: #17212B">DHARA will ask <span style="font-weight: 600">"Are you OK?"</span> halfway. Tap to see how it looks.</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7A5B17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </a>
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 15px; font-weight: 600; color: #505B68">Cannot speak? Type your secret word here</span>
        <input type="text" value="{{word}}" onChange="{{setWord}}" placeholder="Looks like a normal note" style="height: 52px; border-radius: 14px; border: 1.5px solid #505B68; background: #FFFFFF; padding: 0 16px; font-family: inherit; font-size: 16px; color: #17212B; box-sizing: border-box">
      </label>
      <sc-if value="{{wordHit}}" hint-placeholder-val="{{false}}">
        <p class="rise" style="margin: 0; font-size: 14px; line-height: 1.4; color: #7A5B17; font-weight: 600">A message for your circle is ready in your SMS app. Press send there.</p>
      </sc-if>
      <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
        <button onClick="{{stop}}" style="height: 68px; border-radius: 18px; border: none; background: #1F6B4A; color: #FFFFFF; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 20px; font-weight: 600">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
          I reached. Stop sharing
        </button>
        <a href="Emergency.dc.html" style="height: 64px; border-radius: 18px; background: #B42318; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600">I need help now</a>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{stopped}}" hint-placeholder-val="{{false}}">
    <div class="rise" style="padding: 24px 20px 20px; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
      <div style="width: 96px; height: 96px; border-radius: 48px; background: #1F6B4A; display: flex; align-items: center; justify-content: center; margin-top: 60px">
        <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </div>
      <h1 style="margin: 0; font-family: 'Fraunces', serif; font-size: 28px; font-weight: 600; color: #14365A">Glad you reached</h1>
      <p style="margin: 0; font-size: 17px; line-height: 1.45; color: #505B68">Sharing has stopped. Nobody can see where you are.</p>
      <div style="margin-top: auto; width: 100%; display: flex; flex-direction: column; gap: 10px">
        <a href="Home.dc.html" style="height: 64px; border-radius: 18px; background: #14365A; color: #FFFFFF; font-size: 20px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Go to Home</a>
        <button onClick="{{restart}}" style="height: 52px; border: none; background: none; font-family: inherit; font-size: 16px; font-weight: 600; color: #14365A">Start sharing again</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
componentDidMount() {
this.timer = setInterval(() => {
const s = this.state || {};
if (s.stopped) return;
const left = s.left === undefined ? 2520 : s.left;
if (left > 0) this.setState({ left: left - 1 });
}, 1000);
}
componentWillUnmount() {
clearInterval(this.timer);
}
renderVals() {
const s = this.state || {};
const total = s.total || 3600;
const left = s.left === undefined ? 2520 : s.left;
const stopped = !!s.stopped;
const word = s.word || '';
const m = Math.floor(left / 60);
const sec = left % 60;
return {
live: !stopped, stopped: stopped,
headBg: stopped ? '#14365A' : '#1F6B4A',
headTitle: stopped ? 'Sharing is off' : 'Sharing is on',
headSub: stopped ? 'Nobody can see where you are' : 'Sharing with the people you chose',
dotClass: stopped ? '' : 'blink',
clock: m + ':' + (sec < 10 ? '0' : '') + sec,
pct: Math.max(4, Math.min(96, Math.round((1 - left / total) * 100))) + '%',
more: () => this.setState({ left: left + 1800, total: total + 1800 }),
word: word,
wordHit: word.trim().length >= 4,
setWord: (e) => this.setState({ word: e.target.value }),
stop: () => this.setState({ stopped: true }),
restart: () => this.setState({ stopped: false, left: 2520, total: 3600 })
};
}
}
</script>
</body>
</html>
