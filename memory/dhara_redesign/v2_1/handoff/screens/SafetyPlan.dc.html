<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>37 Safety plan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;family=Hind:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}*{box-sizing:border-box}a{text-decoration:none}button{cursor:pointer;font-family:inherit}
@keyframes dFadeIn{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width:390px;height:844px;background:linear-gradient(180deg,#2D1B4E 0%,#1A0E30 100%);color:#fff;font-family:'Hind',sans-serif;display:flex;flex-direction:column;position:relative">

  <!-- nav -->
  <div style="padding:16px 20px 0;display:flex;align-items:center;gap:12px">
    <a href="WomenShield.dc.html" aria-label="Back" style="width:48px;height:48px;border-radius:24px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"></path></svg></a>
    <div style="flex:1;font-family:'Fraunces',serif;font-size:20px;font-weight:600">Safety plan</div>
    <a href="Home.dc.html" aria-label="Home" style="width:48px;height:48px;border-radius:24px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1z"></path></svg></a>
  </div>

  <div style="flex:1;overflow:auto;padding:14px 20px 84px">

    <h1 style="margin:0 0 6px;font-family:'Fraunces',serif;font-size:24px;font-weight:700;animation:dFadeIn .4s ease-out">Your escape checklist</h1>
    <p style="margin:0 0 16px;font-size:14px;color:rgba(255,255,255,.78);line-height:1.5;animation:dFadeIn .4s ease-out .05s both">Prepare everything you need before you leave. Check off items as you gather them.</p>

    <!-- Progress bar -->
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;animation:dFadeIn .4s ease-out .08s both">
      <div style="flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden"><div style="width:35%;height:100%;border-radius:3px;background:linear-gradient(90deg,#E91E63,#F48FB1)"></div></div>
      <div style="font-size:12px;font-weight:600;color:rgba(255,255,255,.78)">4/12</div>
    </div>

    <!-- Checklist sections -->
    <div style="display:flex;flex-direction:column;gap:16px">
      <sc-for list="{{sections}}" as="sec" hint-placeholder-count="3">
        <div style="animation:dFadeIn .4s ease-out {{sec.d}} both">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
            <div style="width:28px;height:28px;border-radius:8px;background:{{sec.bg}};display:flex;align-items:center;justify-content:center;flex-shrink:0">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{sec.ic}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{sec.ipath}}"></path></svg>
            </div>
            <div style="font-size:13px;font-weight:700;color:rgba(255,255,255,.78);text-transform:uppercase;letter-spacing:.5px">{{sec.label}}</div>
          </div>
          <div style="display:flex;flex-direction:column;gap:6px">
            <sc-for list="{{sec.items}}" as="item" hint-placeholder-count="3">
              <div style="display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px 14px;min-height:44px">
                <div style="width:22px;height:22px;border-radius:6px;border:2px solid {{item.chk}};display:flex;align-items:center;justify-content:center;flex-shrink:0">
                  <sc-if value="{{item.done}}" hint-placeholder-val="{{true}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{item.chk}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg></sc-if>
                </div>
                <div style="font-size:14px;color:{{item.clr}}">{{item.name}}</div>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>

    <!-- Evidence tip -->
    <div style="margin-top:18px;display:flex;gap:10px;background:rgba(233,30,99,.1);border:1px solid rgba(233,30,99,.2);border-radius:14px;padding:14px 16px;animation:dFadeIn .4s ease-out .45s both">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E91E63" stroke-width="1.8" stroke-linecap="round" style="flex-shrink:0;margin-top:2px"><path d="M12 3l8 4v5c0 4.5-3.2 7.3-8 9-4.8-1.7-8-4.5-8-9V7z"></path></svg>
      <div style="font-size:13px;color:rgba(255,255,255,.78);line-height:1.5">Photograph all evidence (injuries, messages, damage) and store copies with your trusted circle.</div>
    </div>
  </div>

  <a href="Emergency.dc.html" aria-label="SOS" style="position:absolute;right:16px;bottom:28px;height:48px;padding:0 16px;border-radius:24px;background:#B42318;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;box-shadow:0 6px 18px rgba(180,35,24,.35)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a9 9 0 00-9 9c0 5 4 8 9 11 5-3 9-6 9-11a9 9 0 00-9-9z"></path></svg>SOS</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals(){
const done={done:true,chk:"#E91E63",clr:"rgba(255,255,255,.4)"};
const todo={done:false,chk:"rgba(255,255,255,.2)",clr:"#fff"};
return {sections:[
 {label:"Documents",bg:"rgba(233,30,99,.15)",ic:"#E91E63",ipath:"M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z",d:".1s",items:[
   {name:"Aadhaar card copy",...done},{name:"Passport / driving licence",...todo},{name:"FIR copies / complaints",...done},{name:"Bank statements",...todo}
 ]},
 {label:"Essentials",bg:"rgba(90,75,158,.15)",ic:"#B39DDB",ipath:"M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4",d:".2s",items:[
   {name:"Cash & spare phone",...done},{name:"Spare house key",...todo},{name:"Medications & prescriptions",...done},{name:"Change of clothes",...todo}
 ]},
 {label:"Evidence",bg:"rgba(176,122,20,.15)",ic:"#D3B675",ipath:"M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z",d:".3s",items:[
   {name:"Photos of injuries",...todo},{name:"Screenshots of threats",...todo},{name:"Audio / video recordings",...todo},{name:"Medical reports",...todo}
 ]}
]};
}
}
</script>
</body>
</html>
